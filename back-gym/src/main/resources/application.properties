spring.application.name=proyecto
server.port=8011

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bd_spring_gym
spring.datasource.username=root
spring.datasource.password=

#(Esto genera tablas automaticamente afectando la estructura ya establecida con true)
spring.jpa.generate-ddl=false
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#Esto es para utilizar mongo
##spring.data.mongodb.uri=mongodb://localhost:27017/CursoSpring

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

