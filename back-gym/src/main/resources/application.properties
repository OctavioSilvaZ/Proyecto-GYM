spring.application.name=proyecto
server.port=8011

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bd_spring_gym
spring.datasource.username=root
spring.datasource.password=

#Cambiar a falso (Esto genera tablas automaticamente afectando la estructura ya establecida)
spring.jpa.generate-ddl=true
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=validate esto es en producción
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

