<!-- Navbar Start -->
<div class="container-fluid p-0 nav-bar">
  <nav class="navbar navbar-expand-lg bg-none navbar-dark py-3">
    <a href="" class="navbar-brand">
      <h1 class="m-0 display-4 font-weight-bold text-uppercase text-white">
        Gymnast
      </h1>
    </a>
    <button
      type="button"
      class="navbar-toggler"
      data-toggle="collapse"
      data-target="#navbarCollapse"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse justify-content-between"
      id="navbarCollapse"
    >
      <div
        class="navbar-nav ml-auto p-4 bg-secondary"
        style="margin-top: -1rem"
      >
        <a routerLink="/" class="nav-item nav-link">Personal</a>
        <a routerLink="/usuarios" class="nav-item nav-link">Usuarios</a>
        <a routerLink="/bonos" class="nav-item nav-link">Bonos</a>
        <a routerLink="/descuentos" class="nav-item nav-link">Descuentos</a>
        <a class="nav-item nav-link">{{ getFechaActual() }}</a>
        <a class="nav-item nav-link">{{ hora }}</a>
        <div class="nav-item dropdown">
          <a
            style="cursor: pointer"
            class="nav-link nav-item dropdown-toggle"
            data-toggle="dropdown"
          >
            {{ nombre }} ({{ rol }})</a
          >
          <div class="dropdown-menu text-capitalize">
            <a
              style="cursor: pointer"
              (click)="methodLogout()"
              class="dropdown-item"
              >Cerrar Sesión</a
            >
          </div>
        </div>
      </div>
    </div>
  </nav>
</div>
<!-- Navbar End -->
