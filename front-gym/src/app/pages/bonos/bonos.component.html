<app-header></app-header>
<div class="container-fluid p-0 position-relative min-vh-100">
  <div class="d-flex flex-column justify-content-center bg-black min-vh-100">
    <img
      class="w-100 min-vh-100"
      src="/assets/img/carousel-2.jpg"
      alt="Image"
    />
    <div
      class="position-absolute top-50 start-50 translate-middle text-white"
      style="width: 80%"
    >
      <div class="container">
        <div class="mb-4 mt-5 pt-5">
          <button class="btn btn-primary mr-5">Seleccionar Bono</button>
          <button class="bg-black text-white btn btn-outline-light">
            Asignar bono a todos
          </button>
        </div>

        <div
          class="d-flex justify-content-between align-items-center pb-2 pt-4"
        >
          <!-- Input y botón dentro del mismo contenedor -->
          <div class="col-sm-5 p-0 m-0">
            <input
              type="text"
              name="personal"
              class="form-control"
              id="personal"
              placeholder="Buscar Personal"
            />
          </div>

          <button class="btn btn-outline-light bg-primary text-white">
            Registrar Nuevo Bono
          </button>
        </div>

        <div class="tab-content">
          <div id="class-all" class="container tab-pane p-0 active">
            <div class="table-responsive">
              <table class="table table-bordered table-lg m-0">
                <thead class="bg-secondary text-white text-center">
                  <tr>
                    <th>Nombre</th>
                    <th>Apellido Paterno</th>
                    <th>Apellido Materno</th>
                    <th>Estado</th>
                    <th>Fecha de Pago</th>
                    <th>Bonos activos</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody class="text-center">
                  @for (dato of personal; track dato.id) {
                  <tr>
                    <th class="align-middle">
                      <h5>{{ dato.nombre }}</h5>
                    </th>
                    <td class="align-middle">
                      <h5>{{ dato.apePaterno }}</h5>
                    </td>
                    <td class="align-middle">
                      <h5>{{ dato.apeMaterno }}</h5>
                    </td>
                    <td class="align-middle">
                      <h5>{{ dato.estado }}</h5>
                    </td>
                    <td class="align-middle">
                      {{ dato.fechaPago }}
                    </td>
                    <td class="align-middle">
                      {{ dato.bono_nombre }}
                    </td>
                    <td class="bg-secondary text-white align-middle">
                      <a class="text-white btn w-100">Asignar</a>
                    </td>
                  </tr>
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
